
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Knowledge Quiz | Digital Pathshala</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f6ff;
            color: #243047;
        }

        .quiz-container {
            max-width: 750px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .quiz-container h1 {
            text-align: center;
            color: #2457c5;
        }

        .intro {
            text-align: center;
            color: #596579;
            line-height: 1.6;
        }

        .progress {
            height: 10px;
            background: #e5eaf3;
            border-radius: 10px;
            margin: 25px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2864dc;
            transition: width 0.3s;
        }

        .question-number {
            color: #2864dc;
            font-weight: bold;
        }

        .question {
            font-size: 22px;
            margin: 15px 0 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 14px;
            border: 2px solid #dce4f0;
            border-radius: 10px;
            background: #fff;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover:not(:disabled) {
            border-color: #2864dc;
            background: #f0f5ff;
        }

        .option.correct {
            background: #e3f8e9;
            border-color: #259447;
        }

        .option.wrong {
            background: #ffebeb;
            border-color: #d93636;
        }

        .option:disabled {
            cursor: default;
            color: #243047;
            opacity: 1;
        }

        .feedback {
            min-height: 28px;
            margin-top: 18px;
            font-weight: bold;
        }

        .quiz-button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            background: #2864dc;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .quiz-button:hover {
            background: #194cae;
        }

        .result {
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #2457c5;
            font-size: 28px;
        }

        .result p {
            font-size: 18px;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2457c5;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .quiz-container {
                margin: 20px 12px;
                padding: 22px 16px;
            }

            .question {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="../index.html" class="logo"><span class="logo-icon">💻</span> Digital <span class="logo-highlight">Pathshala</span></a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#lessons">Lessons</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="files.html">File Lab</a></li>
                <li><a href="fake-messages.html">Spot Fakes</a></li>
                <li><a href="quiz.html" class="active">Quiz</a></li>
                <li><a href="progress.html">Certificate</a></li>
            </ul>
        </nav>
    </header>

    <main class="quiz-container">
        <section id="quiz">
            <h1>Computer Knowledge Quiz</h1>
            <p class="intro">
                Test your knowledge of computers, keyboards, and the internet.
                Choose the correct answer for each question.
            </p>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <p class="question-number" id="questionNumber"></p>
            <h2 class="question" id="questionText"></h2>

            <div class="options" id="options"></div>

            <p class="feedback" id="feedback" aria-live="polite"></p>

            <button class="quiz-button" id="nextButton" onclick="nextQuestion()" disabled>
                Next Question
            </button>
        </section>

        <section class="result" id="result">
            <h1>Quiz Completed!</h1>
            <h2 id="scoreText"></h2>
            <p id="resultMessage"></p>
            <p id="saveNote"></p>
            <button class="quiz-button" onclick="restartQuiz()">Try Again</button>
            <a class="back-link" href="progress.html">See my certificate</a>
        </section>

        <div style="text-align:center;">
            <a class="back-link" href="../index.html">← Back to Home</a>
        </div>
    </main>

    <script src="../lang.js"></script>
    <script src="../script.js"></script>
    <script>
        const questions = [
            {
                question: "What is the brain of a computer called?",
                options: ["Monitor", "CPU", "Keyboard", "Mouse"],
                answer: 1
            },
            {
                question: "Which device is used to type letters?",
                options: ["Mouse", "Printer", "Keyboard", "Speaker"],
                answer: 2
            },
            {
                question: "Which device displays information on a computer?",
                options: ["Monitor", "CPU", "Scanner", "Microphone"],
                answer: 0
            },
            {
                question: "Which of these is a web browser?",
                options: ["MS Paint", "Google Chrome", "Calculator", "Notepad"],
                answer: 1
            },
            {
                question: "What is the full form of CPU?",
                options: [
                    "Computer Personal Unit",
                    "Central Processing Unit",
                    "Central Program Utility",
                    "Computer Processing User"
                ],
                answer: 1
            },
            {
                question: "Which key is used to create a space between words?",
                options: ["Enter", "Shift", "Spacebar", "Esc"],
                answer: 2
            },
            {
                question: "What do we use to browse websites?",
                options: ["Web browser", "Paint", "Camera", "Calculator"],
                answer: 0
            },
            {
                question: "Which device is commonly used to move the pointer?",
                options: ["Printer", "Mouse", "Monitor", "Speaker"],
                answer: 1
            },
            {
                question: "What should you do with your password?",
                options: [
                    "Share it with everyone",
                    "Write it on a public wall",
                    "Keep it private",
                    "Use your name only"
                ],
                answer: 2
            },
            {
                question: "Which of these is used to send electronic messages?",
                options: ["Email", "Paint", "Keyboard", "Folder"],
                answer: 0
            },
            {
                question: "What is a folder used for?",
                options: [
                    "To cook food",
                    "To keep files together",
                    "To charge the mouse",
                    "To paint the screen"
                ],
                answer: 1
            },
            {
                question: "A message says you won a prize and asks for your OTP. What should you do?",
                options: [
                    "Send the OTP quickly",
                    "Share it with friends",
                    "Do not reply and tell a teacher",
                    "Click every link"
                ],
                answer: 2
            },
            {
                question: "Where can you send a homework file in this class lab?",
                options: [
                    "Into a class folder",
                    "To a stranger",
                    "On the classroom wall",
                    "Inside the keyboard"
                ],
                answer: 0
            },
            {
                question: "Which of these is hardware?",
                options: ["MS Paint", "A keyboard", "Google Chrome", "A folder name"],
                answer: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionNumber = document.getElementById("questionNumber");
        const questionText = document.getElementById("questionText");
        const optionsContainer = document.getElementById("options");
        const feedback = document.getElementById("feedback");
        const nextButton = document.getElementById("nextButton");
        const progressBar = document.getElementById("progressBar");

        function showQuestion() {
            answered = false;

            const current = questions[currentQuestion];

            Pathshala.showPack(questionNumber, {
                en: line("Question {n} of {total}", { n: currentQuestion + 1, total: questions.length }, "en"),
                hi: line("Question {n} of {total}", { n: currentQuestion + 1, total: questions.length }, "hi"),
                mr: line("Question {n} of {total}", { n: currentQuestion + 1, total: questions.length }, "mr")
            });

            Pathshala.setText(questionText, current.question);
            optionsContainer.innerHTML = "";
            feedback.textContent = "";
            nextButton.disabled = true;
            Pathshala.setText(
                nextButton,
                currentQuestion === questions.length - 1
                    ? "See Result"
                    : "Next Question"
            );

            progressBar.style.width =
                `${(currentQuestion / questions.length) * 100}%`;

            current.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.className = "option";
                Pathshala.setText(button, option);

                button.onclick = () => selectAnswer(index, button);

                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, selectedButton) {
            if (answered) return;

            answered = true;
            const correctIndex = questions[currentQuestion].answer;
            const optionButtons = optionsContainer.querySelectorAll(".option");

            optionButtons.forEach((button, index) => {
                button.disabled = true;

                if (index === correctIndex) {
                    button.classList.add("correct");
                }
            });

            if (selectedIndex === correctIndex) {
                score++;
                Pathshala.setText(feedback, "Correct answer! Well done.");
                feedback.style.color = "#21843c";
            } else {
                selectedButton.classList.add("wrong");
                Pathshala.setText(feedback, "Not quite! The correct answer is highlighted.");
                feedback.style.color = "#c72f2f";
            }

            nextButton.disabled = false;
        }

        function nextQuestion() {
            if (!answered) return;

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz").style.display = "none";
            document.getElementById("result").style.display = "block";

            progressBar.style.width = "100%";

            Pathshala.showPack(document.getElementById("scoreText"), {
                en: line("Your Score: {score} / {total}", { score: score, total: questions.length }, "en"),
                hi: line("Your Score: {score} / {total}", { score: score, total: questions.length }, "hi"),
                mr: line("Your Score: {score} / {total}", { score: score, total: questions.length }, "mr")
            });

            var ratio = score / questions.length;
            var message = "Keep learning! You can improve with practice.";

            if (ratio === 1) {
                message = "Excellent! You answered every question correctly.";
            } else if (ratio >= 0.7) {
                message = "Great work! Keep practising to learn even more.";
            } else if (ratio >= 0.4) {
                message = "Good effort! Review the lessons and try again.";
            }

            Pathshala.setText(document.getElementById("resultMessage"), message);

            var saveNote = document.getElementById("saveNote");
            if (window.Pathshala) {
                Pathshala.saveProgress("quiz", score, questions.length).then(function (result) {
                    if (result && result.ok) {
                        Pathshala.fill(saveNote, "Your score is saved for {name}.", { name: Pathshala.getName() });
                    } else {
                        Pathshala.setText(saveNote, "Type your name on the home page to save this score on your certificate.");
                    }
                }).catch(function () {
                    Pathshala.setText(saveNote, "The class server is off, so this score stayed on this page only.");
                });
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById("quiz").style.display = "block";
            document.getElementById("result").style.display = "none";
            showQuestion();
        }

        showQuestion();
    </script>

</body>
</html>
